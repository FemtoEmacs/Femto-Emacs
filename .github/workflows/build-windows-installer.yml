name: Windows installer
on:
  push:
    branches: [windows]
  workflow_dispatch:
concurrency:
  group: chezweb-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Preserve Unix line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Restore Cygwin package downloads
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: 'D:\cygwin-packages'
          key: chezweb-cygwin-x64-20261104
      - name: Install Cygwin build environment
        id: cygwin
        timeout-minutes: 12
        uses: cygwin/cygwin-install-action@5a1b0cd107181fa6bb6bf3f90d500f4fb3132f18
        with:
          install-dir: 'C:\cygwin64'
          site: https://cygwin.mirror.constant.com/
          packages: gcc-core binutils make libncurses-devel pkg-config curl unzip xz mintty
          add-to-path: false
      - name: Save Cygwin package downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: 'D:\cygwin-packages'
          key: chezweb-cygwin-x64-20261104
      - name: Key the compiled Windows product
        id: product-key
        shell: pwsh
        run: |
          $tree = (git ls-tree -r HEAD | Where-Object { $_ -notmatch "`t(\.github/|git/|windows/smoke-test\.sh$)" }) -join "`n"
          $packages = (Get-FileHash 'C:\cygwin64\etc\setup\installed.db' -Algorithm SHA256).Hash
          $cpu = (Get-CimInstance Win32_Processor).Name -join ' '
          $bytes = [Text.Encoding]::UTF8.GetBytes("$tree`n$packages`n$cpu")
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
          "key=chezweb-win-product-$hash" >> $env:GITHUB_OUTPUT
      - name: Restore compiled Windows product
        id: product
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.product-key.outputs.key }}
          path: |
            build/windows/*Setup.exe
            build/windows/pty-test.exe
            build/windows/installed-packages.txt
            build/windows/SHA256SUMS
            windows-build.log
      - name: Install installer compiler
        if: steps.product.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build Chezweb and installer
        if: steps.product.outputs.cache-hit != 'true'
        shell: C:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail {0}
        run: |
          export PATH=/usr/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash windows/build-installer.sh 2>&1 | tee windows-build.log
      - name: Check cursor input and Markdown Enter regressions
        if: steps.product.outputs.cache-hit != 'true'
        shell: C:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail {0}
        run: |
          export PATH=/usr/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          export PATH="$PWD:$PATH"
          make check-navigation check-utf8-input check-utf8-typing check-markdown-blank-newline
      - name: Cache compiled Windows product
        if: steps.product.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.product-key.outputs.key }}
          path: |
            build/windows/*Setup.exe
            build/windows/pty-test.exe
            build/windows/installed-packages.txt
            build/windows/SHA256SUMS
            windows-build.log
      - name: Archive the matching current source
        shell: pwsh
        run: git archive --format=tar.gz -o build/windows/Chezweb-source.tar.gz HEAD
      - name: Install into a clean directory and test
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\Chezweb installed test"
          $installer = "$env:GITHUB_WORKSPACE\build\windows\Chezweb-Windows-x86_64-Setup.exe"
          $p = Start-Process $installer -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          $env:PATH = "$dest\bin;$dest\app;$env:SystemRoot\system32;$env:SystemRoot"
          & "$dest\bin\bash.exe" --noprofile --norc "$env:GITHUB_WORKSPACE\windows\smoke-test.sh" $dest "$env:GITHUB_WORKSPACE\build\windows\pty-test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed editor failed' }
          # A real SDL window must become ready, load its fonts and close cleanly.
          $env:HOME = "$dest/tmp/gui-home"
          $env:CHEZEMAX_NO_INIT = '1'
          $env:SDL_RENDER_DRIVER = 'software'
          $gui = Start-Process "$dest/app/chezweb-gui.exe" -WorkingDirectory $dest -PassThru -RedirectStandardError "$dest/tmp/gui-errors.txt"
          $ready = $false
          for ($i=0; $i -lt 120; $i++) {
            $gui.Refresh()
            if ($gui.HasExited) { Get-Content "$dest/tmp/gui-errors.txt"; throw 'GUI exited before readiness' }
            if ($gui.MainWindowTitle -match '(^Chezweb$| - Chezweb$)') { $ready = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (!$ready) { $gui.Kill(); throw 'SDL window never became ready' }
          if (!$gui.CloseMainWindow() -or !$gui.WaitForExit(30000)) { $gui.Kill(); throw 'GUI did not close' }
          if ($gui.ExitCode -ne 0) { throw 'GUI exit failed' }
          $u = Start-Process "$dest\Uninstall.exe" -WorkingDirectory $env:RUNNER_TEMP -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw 'Uninstaller failed' }
      - name: Download corresponding component sources
        shell: C:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail {0}
        run: |
          export PATH=/usr/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          sh .github/scripts/windows-sources.sh build/windows/installed-packages.txt build/windows/cygwin-sources
      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Chezweb-Windows-x86_64
          path: |
            build/windows/*Setup.exe
            build/windows/SHA256SUMS
            build/windows/installed-packages.txt
            windows-build.log
          retention-days: 30
      - name: Upload matching component sources
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Chezweb-Windows-corresponding-source
          path: |
            build/windows/*source.tar.gz
            build/windows/cygwin-sources/
            build/windows/installed-packages.txt
          retention-days: 30
      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            windows-build.log
            ${{ runner.temp }}/Chezweb installed test/tmp/
