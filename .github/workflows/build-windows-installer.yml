name: Build Windows package
on:
  workflow_dispatch:
    inputs:
      installed_smoke_test:
        description: Run the installed terminal, GUI and uninstall smoke test
        type: boolean
        default: false
  workflow_call:
    inputs:
      installed_smoke_test:
        description: Test the installed CLI, GUI and terminal before publication
        type: boolean
        default: false
      source_ref:
        type: string
        default: windows
concurrency:
  group: chezweb-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Preserve Unix line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Restore Cygwin package downloads
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: 'D:\cygwin-packages'
          key: chezweb-cygwin-x64-20261104
      - name: Install Cygwin build environment
        id: cygwin
        timeout-minutes: 12
        uses: cygwin/cygwin-install-action@5a1b0cd107181fa6bb6bf3f90d500f4fb3132f18
        with:
          install-dir: 'C:\cygwin64'
          site: https://cygwin.mirror.constant.com/
          packages: gcc-core binutils make libncurses-devel pkg-config curl unzip xz mintty
          add-to-path: false
      - name: Save Cygwin package downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: 'D:\cygwin-packages'
          key: chezweb-cygwin-x64-20261104
      - name: Key the compiled Windows product
        id: product-key
        shell: pwsh
        run: |
          $tree = (git ls-tree -r HEAD | Where-Object { $_ -notmatch "`t(\.github/|git/|windows/smoke-test\.sh$)" }) -join "`n"
          $packages = (Get-FileHash 'C:\cygwin64\etc\setup\installed.db' -Algorithm SHA256).Hash
          $cpu = (Get-CimInstance Win32_Processor).Name -join ' '
          $bytes = [Text.Encoding]::UTF8.GetBytes("$tree`n$packages`n$cpu")
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
          "key=chezweb-win-product-$hash" >> $env:GITHUB_OUTPUT
      - name: Restore compiled Windows product
        id: product
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.product-key.outputs.key }}
          path: |
            build/windows/*Setup.exe
            build/windows/pty-test.exe
            build/windows/installed-packages.txt
            build/windows/SHA256SUMS
            windows-build.log
      - name: Install installer compiler
        if: steps.product.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          }
          throw 'Installer compiler installation failed after three attempts'
      - name: Build native installer PATH helper
        if: steps.product.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $target = & gcc -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $target -notmatch '^x86_64-.*mingw32$') { throw "Expected a native Windows compiler, got $target" }
          New-Item -Force -ItemType Directory build/windows | Out-Null
          gcc -O2 -Wall -Wextra windows/user-path.c -o build/windows/chezweb-user-path.exe -lshell32 -ladvapi32 -luser32
          if ($LASTEXITCODE -ne 0) { throw 'Native PATH helper compilation failed' }
      - name: Build Chezweb and installer
        if: steps.product.outputs.cache-hit != 'true'
        shell: C:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail {0}
        run: |
          export PATH=/usr/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          bash windows/build-installer.sh 2>&1 | tee windows-build.log
          export PATH="$PWD:$PATH"
          make check-navigation check-utf8-input check-paste-decoder check-filename-completion check-windows-paths
          mkdir -p build/test-tmp
          export TMPDIR="$PWD/build/test-tmp" ENDURANCE_KEEP=1 CHEZWEB_PTY_TRACE=1
          make check-clipboard-capacity check-compiled check-fuzz-core check-fuzz-found check-big-edit check-boundaries-quick
          make check-stray-bytes check-accent-motion check-cluster-motion check-backup check-shards check-esc-nul check-comment-context check-syntax-open check-org-eval check-speed-report check-sexp-speed check-sexp-scan check-block-fill
          make check-utf8-typing check-markdown-blank-newline check-bracketed-paste check-backdoor-guard check-char-width check-ghost-window check-line-motion check-chinese-input check-polytonic check-org-mode
      - name: Cache compiled Windows product
        if: steps.product.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.product-key.outputs.key }}
          path: |
            build/windows/*Setup.exe
            build/windows/pty-test.exe
            build/windows/installed-packages.txt
            build/windows/SHA256SUMS
            windows-build.log
      - name: Verify installer registers and removes the user command
        timeout-minutes: 4
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\Chezweb PATH test"
          $installer = "$env:GITHUB_WORKSPACE\build\windows\Chezweb-Windows-x86_64-Setup.exe"
          $before = [Environment]::GetEnvironmentVariable("Path", "User")
          $install = Start-Process $installer -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup exited with $($install.ExitCode)" }
          try {
            $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
            if (($userPath -split ';') -notcontains "$dest\command") { throw "Setup did not add Chezweb to the user PATH" }
            $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot;$userPath"
            # cmd searches the working directory before PATH. The repository
            # contains an uninstalled chezweb.exe, so test from outside it.
            Push-Location $env:RUNNER_TEMP
            try {
              $resolved = @(& where.exe chezweb)
              if ($LASTEXITCODE -ne 0 -or $resolved[0] -ine "$dest\command\chezweb.cmd") {
                throw "Unexpected command resolution: $resolved"
              }
              $version = & cmd.exe /d /c chezweb --version 2>&1
              $exitCode = $LASTEXITCODE
              if ($exitCode -ne 0 -or -not ($version -match '^Chezweb ')) {
                throw "Installed chezweb exited with status $exitCode. Output: $version"
              }
              Write-Host $version
            } finally {
              Pop-Location
            }
          } finally {
            $uninstall = Start-Process "$dest\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          }
          $after = [Environment]::GetEnvironmentVariable("Path", "User")
          if ("$after" -cne "$before") { throw 'Uninstall did not restore the previous user PATH' }
      - name: Archive the matching current source
        if: github.event_name != 'workflow_dispatch' || !inputs.installed_smoke_test
        shell: pwsh
        run: git archive --format=tar.gz -o build/windows/Chezweb-source.tar.gz HEAD
      - name: Download corresponding component sources
        if: github.event_name != 'workflow_dispatch' || !inputs.installed_smoke_test
        shell: C:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail {0}
        run: |
          export PATH=/usr/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          sh .github/scripts/windows-sources.sh build/windows/installed-packages.txt build/windows/cygwin-sources
      - name: Upload matching component sources
        if: success() && (github.event_name != 'workflow_dispatch' || !inputs.installed_smoke_test)
        uses: actions/upload-artifact@v4
        with:
          name: Chezweb-Windows-corresponding-source
          path: |
            build/windows/*source.tar.gz
            build/windows/cygwin-sources/
            build/windows/installed-packages.txt
          retention-days: 30
      - name: Upload test installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Chezweb-Windows-x86_64-test
          path: |
            build/windows/*Setup.exe
            build/windows/SHA256SUMS
            build/windows/installed-packages.txt
            windows-build.log
          retention-days: 30
      - name: Build terminal transport probe
        if: inputs.installed_smoke_test
        shell: C:\cygwin64\bin\bash.exe --noprofile --norc -o igncr -eo pipefail {0}
        run: |
          export PATH=/usr/bin:$PATH
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          gcc -O2 -Wall -Isrc .github/scripts/windows-terminal-probe.c src/terminal-windows.c -o build/windows/terminal-probe.exe
      - name: Install into a clean directory and test
        if: inputs.installed_smoke_test
        timeout-minutes: 12
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\Chezweb installed test"
          $installer = "$env:GITHUB_WORKSPACE\build\windows\Chezweb-Windows-x86_64-Setup.exe"
          $p = Start-Process $installer -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          $pathBeforeSmoke = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($pathBeforeSmoke -split ";") -notcontains "$dest\command") { throw "Chezweb command is absent from the user PATH" }
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot;$pathBeforeSmoke"
          $version = & cmd.exe /d /c chezweb --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "^Chezweb ") { throw "chezweb command failed: $version" }
          $env:PATH = "$dest\bin;$dest\app;$env:SystemRoot\system32;$env:SystemRoot"
          function Invoke-InstalledCheck([string] $phase, [int] $timeoutMs) {
            $info = [System.Diagnostics.ProcessStartInfo]::new()
            $info.FileName = "$dest\bin\bash.exe"
            $info.UseShellExecute = $false
            $info.CreateNoWindow = $true
            $info.RedirectStandardOutput = $true
            $info.RedirectStandardError = $true
            foreach ($arg in @('--noprofile', '--norc', "$env:GITHUB_WORKSPACE\windows\smoke-test.sh", $dest, "$env:GITHUB_WORKSPACE\build\windows\pty-test.exe", $phase)) {
              $info.ArgumentList.Add($arg)
            }
            $process = [System.Diagnostics.Process]::Start($info)
            $output = $process.StandardOutput.ReadToEndAsync()
            $errors = $process.StandardError.ReadToEndAsync()
            $finished = $process.WaitForExit($timeoutMs)
            if (!$finished) {
              $process.Kill($true)
              [void] $process.WaitForExit(5000)
            }
            if ($output.Wait(5000)) { Write-Output $output.Result }
            if ($errors.Wait(5000)) { Write-Output $errors.Result }
            if (!$finished) { throw "Installed $phase check timed out; its process tree was terminated" }
            if ($process.ExitCode -ne 0) { throw "Installed $phase check failed ($($process.ExitCode))" }
            $process.Dispose()
          }
          Invoke-InstalledCheck cli 360000
          # A real SDL window must become ready, load its fonts and close cleanly.
          $env:HOME = "$dest/tmp/gui-home"
          $env:CHEZEMAX_NO_INIT = '1'
          $env:SDL_RENDER_DRIVER = 'software'
          $gui = Start-Process "$dest/app/chezweb-gui.exe" -WorkingDirectory $dest -PassThru -RedirectStandardError "$dest/tmp/gui-errors.txt"
          $ready = $false
          for ($i=0; $i -lt 120; $i++) {
            $gui.Refresh()
            if ($gui.HasExited) { Get-Content "$dest/tmp/gui-errors.txt"; throw 'GUI exited before readiness' }
            if ($gui.MainWindowTitle -match '(^Chezweb$| - Chezweb$)') { $ready = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (!$ready) { $gui.Kill(); throw 'SDL window never became ready' }
          if (!$gui.CloseMainWindow() -or !$gui.WaitForExit(30000)) { $gui.Kill(); throw 'GUI did not close' }
          if ($gui.ExitCode -ne 0) { throw 'GUI exit failed' }
          Copy-Item "$env:GITHUB_WORKSPACE\build\windows\terminal-probe.exe" "$dest/tmp/terminal-probe.exe"
          try { Invoke-InstalledCheck terminal 150000 }
          finally {
            foreach ($file in @('transport-native.log', 'transport-outer.log', 'transport-screen', 'term-screen')) {
              $path = "$dest/tmp/$file"
              if (Test-Path $path) { Write-Output "--- $file"; Get-Content $path -Tail 60 }
            }
          }
          $u = Start-Process "$dest\Uninstall.exe" -WorkingDirectory $env:RUNNER_TEMP -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw 'Uninstaller failed' }
          $pathAfter = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($pathAfter -split ";") -contains "$dest\command") { throw "Chezweb command remains on the user PATH" }
      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            windows-build.log
            build/test-tmp
            ${{ runner.temp }}/Chezweb installed test/tmp/
