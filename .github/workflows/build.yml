name: build

# Builds and tests SBEmacs on Linux and macOS.  The Windows installer has
# its own workflow, build-windows-installer.yml.
# Pushing a tag such as v2.0.0 also publishes a GitHub release with one
# archive for Linux and macOS.

on:
  push:
    branches: [ master, main, sbcl, windows ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # x86_64
          - os: ubuntu-24.04-arm
          - os: macos-latest    # Apple silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL and ncurses (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl libncurses-dev pkg-config \
            libsdl2-dev libsdl2-ttf-dev fonts-dejavu-core xvfb

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl sdl2 sdl2_ttf pkg-config

      - name: Build
        run: make

      - name: Test
        run: |
          make test
          ./sbemacs --version
          ls libsbemacs-gui.*               # the GUI library must have been built

      - name: GUI smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          # the window must open and stay up; timeout ends it (exit 124)
          set +e
          xvfb-run -a timeout 5 ./sbemacs --gui README.md 2> gui.err
          code=$?
          cat gui.err
          test $code -eq 124 && ! grep -q "using the terminal" gui.err

      - name: Package
        run: |
          make dist
          cd dist && tar czf "$(ls -d sbemacs-*/ | head -1 | tr -d /).tar.gz" sbemacs-*/

      - uses: actions/upload-artifact@v4
        with:
          name: sbemacs-${{ matrix.os }}
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ unix ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
