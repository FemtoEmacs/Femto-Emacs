name: Portable build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # macOS Intel runners vary twofold: its tests took 34 to 39 minutes,
    # then a slow one built in 8 minutes instead of 4 and passed 50
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Intel
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's mirrors hung for an hour twice on 11 November 2026: each try
      # gives up after six minutes, and there are three tries
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for try in 1 2 3; do
            if timeout 360 sudo apt-get $apt update &&
               timeout 360 sudo apt-get $apt install -y build-essential libncurses-dev libsdl2-dev libsdl2-ttf-dev pkg-config curl xz-utils; then
              exit 0
            fi
            echo "apt failed (try $try); trying again in 20 s"
            sleep 20
            sudo dpkg --configure -a || true   # an install cut short
          done
          exit 1
      - name: Install optional Mac SDL libraries
        if: runner.os == 'macOS'
        run: brew install pkg-config sdl2 sdl2_ttf
      - name: Show detected configuration
        run: make show-config check-platform
      - name: Build with the common makefile
        run: make -j2
      - name: Verify browser editor is included without a browser SDK
        run: |
          test -s Chezweb.html
          test -s build/chezweb.js
          test -s build/chezweb.wasm
          make check-browser-assets
      - name: Test editor, runtime, prompts and mocked assistants
        run: make check check-ui check-selfhost

      - name: Package the macOS app
        if: runner.os == 'macOS' && github.event_name == 'push'
        run: |
          make app
          python3 tools/bundle-macos-libraries.py Chezweb.app
          codesign --force --deep --sign - Chezweb.app
          codesign --verify --deep --strict Chezweb.app
          Chezweb.app/Contents/MacOS/chezweb-gui --version
          ditto -c -k --keepParent Chezweb.app "Chezweb-macOS-$(uname -m).zip"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && github.event_name == 'push'
        with:
          name: Chezweb-macOS-${{ runner.arch }}
          path: Chezweb-macOS-*.zip
          if-no-files-found: error

  # The native Windows port is maintained on its own branch.
  windows:
    name: Windows x86_64 installer
    uses: FemtoEmacs/Femto-Emacs/.github/workflows/build-windows-installer.yml@windows
    with:
      source_ref: windows
