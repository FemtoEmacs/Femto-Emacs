name: build

# Builds and tests SBEmacs on Linux, macOS and Windows.
# Pushing a tag such as v2.0.0 also publishes a GitHub release with one
# archive per platform.

on:
  push:
    branches: [ master, main, sbcl, windows ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # x86_64
          - os: ubuntu-24.04-arm
          - os: macos-latest    # Apple silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL and ncurses (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl libncurses-dev pkg-config \
            libsdl2-dev libsdl2-ttf-dev fonts-dejavu-core xvfb

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl sdl2 sdl2_ttf pkg-config

      - name: Build
        run: make

      - name: Test
        run: |
          make test
          ./sbemacs --version
          ls libsbemacs-gui.*               # the GUI library must have been built

      - name: GUI smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          # the window must open and stay up; timeout ends it (exit 124)
          set +e
          xvfb-run -a timeout 5 ./sbemacs --gui README.md 2> gui.err
          code=$?
          cat gui.err
          test $code -eq 124 && ! grep -q "using the terminal" gui.err

      - name: Package
        run: |
          make dist
          cd dist && tar czf "$(ls -d sbemacs-*/ | head -1 | tr -d /).tar.gz" sbemacs-*/

      - uses: actions/upload-artifact@v4
        with:
          name: sbemacs-${{ matrix.os }}
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL 2.6.9
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'sbcl-2.6.9-x86-64-windows-binary.msi'
          & curl.exe -L --fail --silent --show-error --output $msi 'https://downloads.sourceforge.net/project/sbcl/sbcl/2.6.9/sbcl-2.6.9-x86-64-windows-binary.msi'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the official SBCL 2.6.9 MSI' }
          $header = [System.IO.File]::ReadAllBytes($msi)[0..7]
          $oleHeader = [byte[]](0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1)
          if ((Compare-Object $header $oleHeader)) { throw 'The SBCL download is not an MSI file' }
          $process = Start-Process msiexec.exe -ArgumentList '/i', $msi, '/qn', '/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "SBCL installer exited with code $($process.ExitCode)"
          }
          $sbcl = Get-ChildItem "$env:ProgramFiles\Steel Bank Common Lisp" -Filter sbcl.exe -Recurse |
            Select-Object -First 1
          if (-not $sbcl) { throw 'The SBCL 2.6.9 executable was not found after installation' }
          $version = & $sbcl.FullName --noinform --non-interactive --eval '(princ (lisp-implementation-version))' --quit
          if ($version -notcontains '2.6.9') {
            throw "Expected SBCL 2.6.9, found: $($version -join ' ')"
          }
          $sbcl.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit        # so that sbcl.exe from Chocolatey is found
          install: >-
            make
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ncurses
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf

      - name: Build
        run: make

      - name: Test
        run: |
          make test
          ./sbemacs.exe --version
          ./sbemacs.exe --version | grep -F 'SBCL 2.6.9'
          ls libsbemacs-gui.dll

      - name: Package
        run: |
          make dist
          # the DLLs libsbemacs-gui.dll needs (SDL2, SDL2_ttf, FreeType, ...)
          ldd libsbemacs-gui.dll | awk '/\/mingw64\// {print $3}' | xargs -r cp -t dist/sbemacs-windows-*/
          cd dist && zip -qr sbemacs-windows-x86_64.zip sbemacs-windows-*/

      - name: Build Windows installer
        shell: pwsh
        run: |
          $staging = (Get-ChildItem dist -Directory -Filter 'sbemacs-windows-*' | Select-Object -First 1).FullName
          $output = (Resolve-Path dist).Path
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler not found at $compiler"
          }
          & $compiler "/DStagingDir=$staging" "/DOutputDir=$output" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-Item dist\Femto-Emacs-*-Setup.exe
          $installTest = Join-Path $env:RUNNER_TEMP 'femto-emacs-install-test'
          $process = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installTest" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer smoke test exited with code $($process.ExitCode)" }
          $installedVersion = & "$installTest\sbemacs.exe" --version
          if ($installedVersion -notcontains 'SBCL 2.6.9') {
            throw "Installed editor does not use SBCL 2.6.9: $($installedVersion -join ' ')"
          }
          $setup

      - uses: actions/upload-artifact@v4
        with:
          name: sbemacs-windows
          path: |
            dist/*.zip
            dist/*-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ unix, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
