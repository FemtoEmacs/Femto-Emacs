name: Codemax Windows diagnostic

on:
  push:
    branches: [codemax]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codemax-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # The C compiler (MinGW-w64).  SBCL, SDL2, SDL2_ttf and the font are
    # downloaded by the build script, each checked by its SHA-256.
    - name: Install MSYS2 and the C compiler
      uses: msys2/setup-msys2@v2
      with:
        # MINGW64 builds against msvcrt.dll, the C runtime that SDL2's own
        # MinGW DLLs and the Linux cross-compiler use; UCRT64 would mix two
        # runtimes in one program.  So we keep it, knowingly.
        msystem: MINGW64
        suppress-deprecation-warnings: msystem-mingw64
        update: false
        path-type: inherit    # so that powershell, msiexec and NSIS are found
        install: >-
          curl
          unzip
          mingw-w64-x86_64-gcc

    - name: Install NSIS
      shell: pwsh
      run: choco install nsis -y --no-progress

    - name: Build sbemacs.exe and the installer
      run: sh windows/build-installer.sh

    - name: Package the diagnostic editor as codemacs
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $stage = Join-Path $PWD 'build/windows/stage'
        Rename-Item "$stage/sbemacs.exe" 'codemacs.exe'
        $header = Get-Content src/header.h -Raw
        $version = [regex]::Match($header, '#define VERSION[^"\r\n]*"SBEmacs ([0-9.]+)').Groups[1].Value
        if (-not $version) { throw 'Cannot determine installer version' }
        # A runner-only NSIS copy preserves the original product sources/assets.
        $template = Get-Content windows/sbemacs.nsi -Raw
        $template = $template.Replace('SBEmacs', 'codemacs').Replace('sbemacs.exe', 'codemacs.exe')
        $generated = Join-Path $PWD 'windows/codemacs.generated.nsi'
        [IO.File]::WriteAllText($generated, $template, [Text.UTF8Encoding]::new($false))
        $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
        & $nsis -V2 '-DTARGET=x86-unicode' "-DVERSION=$version" "-DSTAGE=$stage" "-DOUTDIR=$PWD/build/windows" $generated
        if ($LASTEXITCODE -ne 0) { throw 'codemacs installer generation failed' }
        Remove-Item build/windows/SBEmacs-*-Setup.exe

    - name: Test installing and launching codemacs
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $setup = (Get-ChildItem build/windows/codemacs-*-Setup.exe | Select-Object -First 1).FullName
        $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw 'codemacs installation failed' }
        $dir = Join-Path $env:LOCALAPPDATA 'Programs/codemacs'
        try {
          if (-not (Test-Path "$dir/codemacs.exe")) { throw 'codemacs.exe missing' }
          if (-not (Test-Path "$env:APPDATA/Microsoft/Windows/Start Menu/Programs/codemacs.lnk")) { throw 'codemacs shortcut missing' }
          $editor = Start-Process "$dir/codemacs.exe" -ArgumentList "$dir/README.md" -PassThru
          Start-Sleep -Seconds 5
          if ($editor.HasExited) { throw 'codemacs exited unexpectedly' }
          Stop-Process -Id $editor.Id
        } finally {
          Start-Process "$dir/Uninstall codemacs.exe" -ArgumentList '/S' -Wait | Out-Null
        }

    # The tests, with the Windows SBCL the build used, on the library it just
    # made.  They go through C-c g's own code (the context sent to Codex, the
    # set-up page, the request, the command line, codex.cmd through Windows'
    # cmd.exe), compile every script as the release build does, and check
    # that a script with CR LF line ends compiles right.  sbcl.exe sits in
    # "Steel Bank Common Lisp", a name with spaces: hence the wrapper.
    - name: Run the tests with the Windows SBCL
      run: |
        SBCL=$(find "$PWD/build/windows/deps/sbcl" -name sbcl.exe | head -1)
        SBCL_DIR=$(cygpath -w "$(dirname "$SBCL")")
        printf '#!/bin/sh\nSBCL_HOME="%s" exec "%s" --core "%s\\sbcl.core" "$@"\n' \
          "$SBCL_DIR" "$SBCL" "$SBCL_DIR" > sbcl-windows
        chmod +x sbcl-windows
        export PATH="$PWD/build/windows/stage:$PATH"     # SDL2.dll for the library
        SBEMACS_TEST_LIB="$(cygpath -w build/windows/stage/libsbemacs-gui.dll)" \
          ./sbcl-windows --noinform --non-interactive --no-sysinit --no-userinit \
                         --load tests/run-tests.lisp

    - name: Install the Codex version from the Windows report
      shell: pwsh
      run: |
        npm install --global @openai/codex@0.142.5
        if ($LASTEXITCODE -ne 0) { throw 'Codex npm installation failed' }

    - name: Test native Windows transport and optionally a real Codex response
      shell: pwsh
      env:
        TEST_CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        TEST_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        $ErrorActionPreference = 'Stop'
        $sbcl = (Get-ChildItem build/windows/deps/sbcl -Filter sbcl.exe -Recurse | Select-Object -First 1).FullName
        $env:SBCL_HOME = Split-Path $sbcl
        $env:SBEMACS_TEST_LIB = Join-Path $PWD 'build/windows/stage/libsbemacs-gui.dll'
        $env:PATH = "$(Join-Path $PWD 'build/windows/stage');$env:PATH"
        $auth = Join-Path $HOME '.codex/auth.json'
        $env:SBEMACS_REAL_CODEX_TEST = '0'
        try {
          if ($env:TEST_CODEX_AUTH_JSON) {
            New-Item (Split-Path $auth) -ItemType Directory -Force | Out-Null
            [IO.File]::WriteAllText($auth, $env:TEST_CODEX_AUTH_JSON, [Text.UTF8Encoding]::new($false))
            $env:SBEMACS_REAL_CODEX_TEST = '1'
          } elseif ($env:TEST_OPENAI_API_KEY) {
            $env:TEST_OPENAI_API_KEY | & codex.cmd login --with-api-key *> $null
            if ($LASTEXITCODE -ne 0) { throw 'Codex API authentication failed; credentials omitted' }
            $env:SBEMACS_REAL_CODEX_TEST = '1'
          }
          Remove-Item Env:TEST_CODEX_AUTH_JSON, Env:TEST_OPENAI_API_KEY -ErrorAction SilentlyContinue
          $diagnostic = Join-Path $env:RUNNER_TEMP 'codemax-diagnostic.lisp'
          $source = @'
        (setf sb-impl::*default-external-format* :utf-8)
        (defparameter *diagnostic-root* (pathname (concatenate 'string (sb-ext:posix-getenv "GITHUB_WORKSPACE") "/")))
        (sb-alien:load-shared-object (sb-ext:posix-getenv "SBEMACS_TEST_LIB") :dont-save t)
        (dolist (f '("package" "ffi" "loader" "core"))
          (load (merge-pathnames (format nil "lisp/~A.lisp" f) *diagnostic-root*)))
        (setf sbemacs::*script-directory* (merge-pathnames "lisp/" *diagnostic-root*))
        (multiple-value-bind (loaded errors)
            (sbemacs::load-scripts :files (sbemacs::script-files sbemacs::*script-directory*)
                                  :cache-directory (merge-pathnames "build/codemax-scripts/" *diagnostic-root*))
          (declare (ignore loaded)) (assert (null errors)))
        (in-package #:sbemacs)
        (assert (member :win32 *features*))
        (let* ((program (find-codex-program)))
          (assert program)
          (format t "~&Discovered: ~A~%" (native program))
          (multiple-value-bind (launcher args) (codex-windows-command program '("--version"))
            (format t "Launcher: ~A~%" launcher)
            (assert (string-equal (pathname-type (pathname launcher)) "exe"))
            (multiple-value-bind (out err code) (codex-capture-process (native (pathname launcher)) args "")
              (declare (ignore err)) (assert (eql code 0))
              (format t "Version: ~A~%" (codex-decode-utf8 out "stdout")))))
        (let ((python (find-program "python.exe")))
          (assert python)
          (multiple-value-bind (out err code)
              (codex-capture-process (native python)
                '("-c" "import sys; d=sys.stdin.buffer.read(); sys.stdout.buffer.write(d); sys.stderr.buffer.write(bytes([130]))")
                "ação português 😀")
            (assert (eql code 0))
            (assert (string= (codex-decode-utf8 out "stdout") "ação português 😀"))
            (assert (equalp err #(130)))
            (assert (handler-case (progn (codex-decode-utf8 err "stderr") nil) (error () t)))
            (format t "PASS Windows UTF-8 stdin/stdout; stderr byte 130 preserved independently.~%"))
          (assert (handler-case
              (progn (codex-capture-process (native python) '("-c" "import time; time.sleep(5)") "" :timeout 0.1) nil)
              (error () (getf *codex-last-capture* :timed-out))))
          (format t "PASS Windows process timeout.~%"))
        (assert (handler-case
            (progn (codex-report-exit-error #() (sb-ext:string-to-octets "Unauthorized Bearer PRIVATE_TOKEN" :external-format :utf-8) 1) nil)
            (error (c) (and (search "authentication failed" (princ-to-string c))
                            (not (search "PRIVATE_TOKEN" (princ-to-string c)))))))
        (format t "PASS authentication diagnostics do not echo credentials.~%")
        (if (equal (sb-ext:posix-getenv "SBEMACS_REAL_CODEX_TEST") "1")
            (let ((*codex-working-directory* (native *default-pathname-defaults*)))
              (handler-case
                  (let ((answer (codex-cli-ask "Reply exactly: ação português 😀. Do not use tools." "Unicode transport test; no source file.")))
                    (assert (string= answer "ação português 😀"))
                    (format t "PASS REAL WINDOWS CODEX RESPONSE: Unicode response verified.~%"))
                (error (c)
                  (format t "~&REAL WINDOWS CODEX FAILED: ~A~%Metadata: ~S~%" c (codex-capture-summary))
                  (sb-ext:exit :code 1))))
            (format t "NOT VALIDATED: real Windows Codex communication needs a configured test credential.~%"))
        (sb-ext:exit :code 0)
        '@
          [IO.File]::WriteAllText($diagnostic, $source, [Text.UTF8Encoding]::new($false))
          & $sbcl --core "$env:SBCL_HOME/sbcl.core" --noinform --non-interactive --no-sysinit --no-userinit --load $diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Windows Codex diagnostic failed' }
          if ($env:SBEMACS_REAL_CODEX_TEST -eq '1') {
            '### Real Windows Codex communication validated' >> $env:GITHUB_STEP_SUMMARY
          } else {
            '### Windows transport tests passed; real Codex communication NOT VALIDATED (no test credential)' >> $env:GITHUB_STEP_SUMMARY
          }
        } finally {
          Remove-Item $auth -Force -ErrorAction SilentlyContinue
          Remove-Item Env:TEST_CODEX_AUTH_JSON, Env:TEST_OPENAI_API_KEY -ErrorAction SilentlyContinue
        }

    - name: Upload the codemacs test installer
      uses: actions/upload-artifact@v4
      with:
        name: codemacs-windows-test-installer
        path: build/windows/codemacs-*-Setup.exe
        if-no-files-found: error
        retention-days: 7
