<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chezweb</title>
<style>html,body{margin:0;background:#1d1f21;color:#c5c8c6;overflow:hidden}header{height:30px;font:13px/30px system-ui;padding:0 8px;white-space:nowrap;overflow:hidden}button{margin-right:16px}canvas{display:block}#keys{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0}#notice-bar{height:24px;box-sizing:border-box;padding:0 8px;font:13px/24px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#282a2e}#notice{color:#f0c674}#starting{position:fixed;top:64px;left:20px;padding:12px;background:#f0c674;color:#222;font:15px system-ui;z-index:2}.failure{background:#cc6666!important;color:white!important}#screen-text{position:fixed;left:-10000px;white-space:pre}#text-layer{position:fixed;z-index:1;margin:0;padding:0;border:0;outline:none;resize:none;background:transparent;color:#c5c8c6;-webkit-text-fill-color:transparent;caret-color:transparent;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;overflow:hidden;tab-size:8;font-variant-ligatures:none;font-kerning:none}#text-layer::selection{background:transparent;-webkit-text-fill-color:transparent}button[aria-pressed="true"]{background:#f0c674;color:#222}</style>
<header><button id="open-file">Open local file</button><button id="choose-folder">Choose folder</button><button id="grammarly-toggle" aria-pressed="false">Grammarly: off</button>Chezweb · AI assistance: use your terminal or SDL window</header>
<div id="notice-bar" role="status"><span id="notice" hidden></span></div>
<div id="starting">Starting Chezweb…</div><canvas id="screen" aria-label="Chezweb editor"></canvas><input id="keys" aria-label="Editor input" autocomplete="off" autocapitalize="off" spellcheck="false"><pre id="screen-text" aria-live="polite"></pre><script>
if(typeof WebAssembly==='undefined'||typeof WebAssembly.Suspending!=='function'||typeof WebAssembly.promising!=='function'){
 document.getElementById('starting').hidden=true;
 var notice=document.getElementById('notice');notice.hidden=false;notice.className='failure';
 notice.textContent='Chezweb requires Chrome with WebAssembly JSPI. Update Chrome and reopen this page.';
}else{var script=document.createElement('script');script.src='build/chezweb.js';document.body.appendChild(script);}
</script></html>
